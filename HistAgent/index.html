<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="HistAgent project website and Atlas Explorer tutorials.">
    <title>HistAgent</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #26384d;
        --muted: #65768a;
        --green: #12655c;
        --line: #dbe7e5;
        --panel: rgba(255, 255, 255, 0.9);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 15%, rgba(170, 218, 208, 0.34), transparent 30%),
          radial-gradient(circle at 88% 84%, rgba(178, 193, 228, 0.34), transparent 32%),
          #f5f8fa;
      }

      main {
        width: min(920px, 100%);
        padding: clamp(42px, 8vw, 82px);
        text-align: center;
        background: var(--panel);
        border: 1px solid rgba(219, 231, 229, 0.9);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(46, 72, 91, 0.1);
        backdrop-filter: blur(12px);
      }

      .mark {
        position: relative;
        width: 86px;
        height: 86px;
        margin: 0 auto 28px;
        border: 4px solid #bdd9d3;
        border-radius: 50%;
        background: #fff;
      }

      .mark span {
        position: absolute;
        display: block;
        border-radius: 50%;
      }

      .mark span:nth-child(1) { width: 20px; height: 20px; left: 19px; top: 21px; background: #ce91b7; }
      .mark span:nth-child(2) { width: 16px; height: 16px; right: 17px; top: 15px; background: #7c91c4; }
      .mark span:nth-child(3) { width: 28px; height: 28px; right: 13px; bottom: 15px; background: #8bb8a8; }
      .mark span:nth-child(4) { width: 15px; height: 15px; left: 20px; bottom: 14px; background: #dda47e; }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--green);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--green);
        font-size: clamp(54px, 10vw, 88px);
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      .subtitle {
        max-width: 720px;
        margin: 24px auto 0;
        font-size: clamp(18px, 2.5vw, 25px);
        line-height: 1.45;
      }

      .note {
        display: inline-block;
        margin: 34px 0 0;
        padding: 10px 16px;
        color: var(--muted);
        font-size: 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f8fbfb;
      }

    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="eyebrow">Project website</p>
      <h1>HistAgent</h1>
      <p class="subtitle">Spatial molecular inference and evidence-grounded reasoning from routine histology.</p>
      <p class="note">Atlas Explorer tutorials and representative examples are being prepared.</p>
    </main>
  </body>
</html>
